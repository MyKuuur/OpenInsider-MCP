name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a previous in-progress run when a new commit lands on the same ref.
# Prevents redundant runs on rapid pushes (typo-fixes etc).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Live drift-detector + MCP-protocol end-to-end check. Runs on PR and manual
  # dispatch. Skipped on direct push to main since the PR already ran smoke.
  smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # Tier 2: live smoke tests — confirm OpenInsider, SEC EDGAR, and FINRA
      # endpoints + URL formats still work. Yahoo live quote checks are omitted
      # from CI smoke because Yahoo's edge responses are noisy.
      - name: Run live smoke tests
        run: SMOKE=1 npx vitest run
      # Tier 3: drive the non-Yahoo MCP tools through the real JSON-RPC stdio
      # transport via the official @modelcontextprotocol/sdk Client. Same path
      # Claude Desktop uses. Exits 1 if any tool call fails.
      - name: Run MCP protocol driver
        env:
          MCP_DRIVER_EXCLUDE: get_quote
        run: node scripts/mcp-driver.mjs NVDA
